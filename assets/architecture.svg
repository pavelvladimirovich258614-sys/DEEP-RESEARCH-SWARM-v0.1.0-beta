<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #475569; }
    .user { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .sup { fill: #1d4ed8; stroke: #1e40af; stroke-width: 2; color: #fff; }
    .agent { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .agent-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .agent-sub { font-size: 11px; fill: #475569; }
    .evidence { fill: #ecfccb; stroke: #4d7c0f; stroke-width: 1.5; }
    .synth { fill: #fae8ff; stroke: #86198f; stroke-width: 2; }
    .final { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
    .label { font-size: 11px; fill: #1e293b; }
    .legend-text { font-size: 11px; fill: #0f172a; }
    .line { stroke: #1e293b; stroke-width: 1.5; fill: none; }
    .line-sup { stroke: #1d4ed8; stroke-width: 1.8; fill: none; }
    .line-pass { stroke: #166534; stroke-width: 2; fill: none; }
    .line-fail { stroke: #b91c1c; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .pill { font-size: 10px; fill: #fff; font-weight: 700; }
  </style>

  <!-- Title -->
  <text x="40" y="36" class="title">🔎 DEEP RESEARCH SWARM — Architecture</text>
  <text x="40" y="56" class="subtitle">Star topology · Supervisor-controlled · One final answer with claim-level citations</text>

  <!-- USER -->
  <rect x="470" y="80" width="160" height="50" rx="10" class="user"/>
  <text x="550" y="105" text-anchor="middle" class="agent-title">USER</text>
  <text x="550" y="121" text-anchor="middle" class="agent-sub">single entry point</text>

  <!-- Cur arrow -->
  <line x1="550" y1="130" x2="550" y2="165" class="line-sup"/>
  <polygon points="544,160 556,160 550,170" fill="#1d4ed8"/>

  <!-- Curator -->
  <rect x="430" y="170" width="240" height="80" rx="12" class="sup"/>
  <text x="550" y="200" text-anchor="middle" class="agent-title" fill="#fff">CURATOR</text>
  <text x="550" y="220" text-anchor="middle" class="agent-sub" fill="#dbeafe">Supervisor / Research Director</text>
  <text x="550" y="237" text-anchor="middle" class="agent-sub" fill="#dbeafe">plan · dispatch · verify · ship</text>

  <!-- Five specialists arranged in a row -->
  <!-- Scout -->
  <rect x="60" y="320" width="180" height="80" rx="10" class="agent"/>
  <text x="150" y="346" text-anchor="middle" class="agent-title">🌐 Wide Web Scout</text>
  <text x="150" y="365" text-anchor="middle" class="agent-sub">discovery · fan-out</text>
  <text x="150" y="382" text-anchor="middle" class="agent-sub">candidate pool</text>

  <!-- Hunter -->
  <rect x="280" y="320" width="180" height="80" rx="10" class="agent"/>
  <text x="370" y="346" text-anchor="middle" class="agent-title">🏛️ Primary Source Hunter</text>
  <text x="370" y="365" text-anchor="middle" class="agent-sub">official docs · repos</text>
  <text x="370" y="382" text-anchor="middle" class="agent-sub">papers · releases</text>

  <!-- Analyst -->
  <rect x="500" y="320" width="180" height="80" rx="10" class="agent"/>
  <text x="590" y="346" text-anchor="middle" class="agent-title">🧪 Evidence Analyst</text>
  <text x="590" y="365" text-anchor="middle" class="agent-sub">deep read · ledger</text>
  <text x="590" y="382" text-anchor="middle" class="agent-sub">claim / source graphs</text>

  <!-- Fact Checker -->
  <rect x="720" y="320" width="180" height="80" rx="10" class="agent"/>
  <text x="810" y="346" text-anchor="middle" class="agent-title">🕵️ Fact Checker</text>
  <text x="810" y="365" text-anchor="middle" class="agent-sub">disprove · audit</text>
  <text x="810" y="382" text-anchor="middle" class="agent-sub">blocking Quality Gate</text>

  <!-- Synthesizer -->
  <rect x="940" y="320" width="160" height="80" rx="12" class="synth"/>
  <text x="1020" y="346" text-anchor="middle" class="agent-title">🧠 Synthesizer</text>
  <text x="1020" y="365" text-anchor="middle" class="agent-sub">final synthesis</text>
  <text x="1020" y="382" text-anchor="middle" class="agent-sub">claim-level citations</text>

  <!-- Curator → 4 specialists (Scout, Hunter, Analyst, Fact Checker) -->
  <line x1="450" y1="250" x2="150" y2="320" class="line-sup"/>
  <line x1="490" y1="250" x2="370" y2="320" class="line-sup"/>
  <line x1="610" y1="250" x2="590" y2="320" class="line-sup"/>
  <line x1="650" y1="250" x2="810" y2="320" class="line-sup"/>

  <!-- Evidence State bar -->
  <rect x="60" y="430" width="840" height="44" rx="8" class="evidence"/>
  <text x="480" y="448" text-anchor="middle" class="label">Evidence Ledger · Claim Graph · Source Graph · Citation Audit</text>
  <text x="480" y="466" text-anchor="middle" class="label" font-size="10">curated and persisted via lobe-agent-documents</text>

  <!-- Specialists → Evidence -->
  <line x1="150" y1="400" x2="150" y2="430" class="line"/>
  <line x1="370" y1="400" x2="370" y2="430" class="line"/>
  <line x1="590" y1="400" x2="590" y2="430" class="line"/>
  <line x1="810" y1="400" x2="810" y2="430" class="line"/>

  <!-- Evidence → Fact Checker (PASS) -->
  <line x1="720" y1="452" x2="900" y2="360" class="line-pass"/>
  <polygon points="895,357 905,360 895,365" fill="#166534"/>
  <text x="780" y="430" class="pill" fill="#166534">PASS</text>

  <!-- Evidence → Cur (return failed) -->
  <line x1="60" y1="452" x2="450" y2="240" class="line-fail"/>
  <text x="180" y="448" class="pill" fill="#b91c1c">FAIL → targeted verification</text>

  <!-- Fact Checker → Synthesizer (PASS path) -->
  <line x1="900" y1="370" x2="940" y2="358" class="line-pass"/>

  <!-- Synthesizer → FINAL -->
  <line x1="1020" y1="400" x2="1020" y2="540" class="line-pass"/>
  <polygon points="1014,534 1026,534 1020,544" fill="#166534"/>

  <rect x="900" y="550" width="240" height="60" rx="10" class="final"/>
  <text x="1020" y="578" text-anchor="middle" class="agent-title">FINAL ANSWER</text>
  <text x="1020" y="596" text-anchor="middle" class="agent-sub">one message · Markdown · citations</text>

  <!-- Legend -->
  <rect x="60" y="630" width="980" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="75" y="650" class="legend-text"><tspan font-weight="700">Legend</tspan>  ·  Curator dispatches and merges · specialists return to Curator · they never recursively delegate</text>
  <text x="75" y="668" class="legend-text">
    <tspan font-weight="700" fill="#1d4ed8">━━ blue</tspan> dispatch ·
    <tspan font-weight="700" fill="#166534">━━ green</tspan> PASS ·
    <tspan font-weight="700" fill="#b91c1c">┄┄ red</tspan> FAIL loop
  </text>
  <text x="75" y="685" class="legend-text">Quality Gate is blocking: Synthesizer runs ONLY after Fact Checker returns PASS.</text>
</svg>